apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app-1
  labels:
    app: web-app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-app-1
  template:
    metadata:
      labels:
        app: web-app-1
    spec:
      containers:
      - name: web-app-1
        image: hdxt25/web-app-1:replaceImageTag
        ports:
        - containerPort: 8080